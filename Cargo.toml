[package]
name = "bird-station"
version = "0.1.0"
edition = "2024"

[dependencies]
# Audio
cpal = "0.17.3"
# Ringbuffer
ringbuf = "0.4"

# logging
env_logger = "0.11.10"
log = "0.4.29"
# byte order conversion
byteorder = "1.5.0"
# macros for better error handling
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# processing encyclopedia data
image = "0.25.10"
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive"] }

# TRMNL EInk Display
trmnl = { version = "0.1", features = ["axum", "render"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.1", features = ["fs", "set-status", "trace"] }

# AI
# ort = "=2.0.0-rc.13"
birdnet-onnx = "2.0.0-rc.16"
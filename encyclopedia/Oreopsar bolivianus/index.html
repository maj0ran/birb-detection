        <p>The Bolivian blackbird (Oreopsar bolivianus) is a species of bird in the family Icteridae. It is monotypic within the genus Oreopsar.<br>It is endemic to Bolivia, where its natural habitats are subtropical or tropical high-altitude shrubland and pastureland.<br><br><br></p>

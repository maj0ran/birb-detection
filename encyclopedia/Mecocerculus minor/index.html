        <p>The sulphur-bellied tyrannulet (Mecocerculus minor) is a species of bird in subfamily Elaeniinae of family Tyrannidae, the tyrant flycatchers. It is found in Colombia, Ecuador, Peru, and Venezuela.<br><br>The sulphur-bellied tyrannulet is monotypic.</p>

        <p>The upland pipit (Anthus sylvanus) is a species of bird in the family Motacillidae.<br>It is found in Afghanistan, China, Hong Kong, India, Nepal, and Pakistan. As its name suggests, it inhabits mountains, typically open areas with grassland at elevations above 500m.<br><br><br><br></p>

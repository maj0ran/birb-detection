        <p>The white-throated shrike-tanager (Lanio leucothorax) is a species of bird in the family Thraupidae. It is found in Costa Rica, Honduras, Nicaragua, and Panama. Its natural habitat is subtropical or tropical moist lowland forests.<br><br><br></p>

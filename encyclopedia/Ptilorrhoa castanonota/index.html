        <p>The chestnut-backed jewel-babbler (Ptilorrhoa castanonota) is a species of bird in the family Cinclosomatidae. It is endemic to New Guinea. Its natural habitats are subtropical or tropical moist lowland forests and subtropical or tropical moist montane forests.<br><br><br></p>

        <p>The brown-and-yellow marshbird (Pseudoleistes virescens) is a species of bird in the family Icteridae.<br>It is found in the Pampas and north to the Paraguayan border and Rio Grande do Sul, where its natural habitats are swamps and pastureland.<br><br></p>

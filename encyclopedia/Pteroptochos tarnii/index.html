        <p>The black-throated huet-huet Spanish pronunciation: [wet wet] (Pteroptochos tarnii) is a species of bird in the family Rhinocryptidae. It is found in southern/central Chile and adjacent western Argentina. Its natural habitat is temperate forest.<br><br></p>

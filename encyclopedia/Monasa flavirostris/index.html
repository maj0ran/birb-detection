        <p>The yellow-billed nunbird (Monasa flavirostris) is a species of near-passerine bird in the family Bucconidae, the puffbirds, nunlets, and nunbirds. It is found in Bolivia, Brazil, Colombia, Ecuador, and Peru.<br><br>The yellow-billed nunbird is monotypic.</p>

        <p>The gray thrasher (Toxostoma cinereum) is a medium-sized passerine bird belonging to the family Mimidae. It is endemic to the Baja California peninsula of Mexico.<br><br>The gray thrasher has two subspecies, the nominate T. c. cinereum and T. c. mearnsi.</p>

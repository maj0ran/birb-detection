        <p>The grey-hooded sierra finch (Phrygilus gayi) is a species of bird in the family Thraupidae.<br>It is found in Argentina and Chile where its natural habitats are subtropical or tropical dry shrubland and subtropical or tropical high-altitude shrubland.<br><br><br></p>

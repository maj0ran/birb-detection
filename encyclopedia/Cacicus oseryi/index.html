        <p>The casqued cacique (Cacicus oseryi), formerly the casqued oropendola, is a species of bird in the family Icteridae.<br>It is found in Bolivia, Brazil, Ecuador, and Peru. Its natural habitat is subtropical or tropical moist lowland forests.<br><br><br></p>

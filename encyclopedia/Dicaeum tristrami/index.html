        <p>The mottled flowerpecker or white-mottled flowerpecker (Dicaeum tristrami) is a species of bird in the family Dicaeidae. It is endemic to Makira in the Solomon Islands. It inhabits primary forest and secondary growth, most commonly in the mountains.<br><br><br></p>

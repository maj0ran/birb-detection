        <p>Hunter's cisticola (Cisticola hunteri) is a species of bird in the family Cisticolidae.<br>It is found in Kenya, Tanzania, and Uganda.<br>Its natural habitats are tropical moist montane and high-elevation shrubland.  It is a dueting species.<br><br><br></p>

        <p>The black-throated saltator (Saltatricula atricollis) is a species of songbird in the family Thraupidae.<br>It is found in Bolivia, Brazil, and Paraguay. Its natural habitats are subtropical or tropical dry forests and dry savanna.<br><br><br></p>

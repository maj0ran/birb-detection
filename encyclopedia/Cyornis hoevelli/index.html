        <p>The blue-fronted blue flycatcher (Eumyias hoevelli), also known as the blue-fronted flycatcher, is a species of bird in the family Muscicapidae.  It is endemic to Indonesia.  Its natural habitat is subtropical or tropical moist montane forests.<br><br><br></p>

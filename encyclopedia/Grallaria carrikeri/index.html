        <p>The pale-billed antpitta (Grallaria carrikeri) is a species of bird in the family Grallariidae. It is endemic to Peru.<br><br>The pale-billed antpitta is monotypic. It and the chestnut-naped antpitta (G. nuchalis) form a superspecies.</p>

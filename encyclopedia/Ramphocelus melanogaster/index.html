        <p>The Huallaga tanager (Ramphocelus melanogaster) or black-bellied tanager, is a species of bird in the family Thraupidae.<br>It is endemic to Peru.<br>Its natural habitats are subtropical or tropical moist lowland forests and heavily degraded former forest.<br><br><br></p>

        <p>The black-chested sparrow (Peucaea humeralis) is a species of bird in the family Passerellidae that is endemic to Mexico. Its natural habitats are subtropical or tropical dry shrubland and subtropical or tropical high-altitude shrubland.<br><br><br></p>

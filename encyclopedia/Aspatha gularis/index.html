        <p>The blue-throated motmot (Aspatha gularis) is a species of bird in the family Momotidae. It is found in El Salvador, Guatemala, Honduras, and Mexico.<br><br>The blue-throated motmot is monotypic. It apparently has no close relatives.</p>

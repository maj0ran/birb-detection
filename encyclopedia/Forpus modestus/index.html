        <p>The dusky-billed parrotlet (Forpus modestus), also known as Sclater's parrotlet, is a small species of parrot in the family Psittacidae. It is the nominate species (F. m. modestus).<br>There is one subspecies: Forpus modestus sclateri.<br><br></p>

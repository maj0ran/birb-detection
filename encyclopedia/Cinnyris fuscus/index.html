        <p>The dusky sunbird (Cinnyris fuscus) is a species of bird in the family Nectariniidae. This relatively dull sunbird is found in arid savanna, thickets and shrubland (e.g. Karoo) in Angola, Botswana, Namibia, and South Africa.<br><br></p>

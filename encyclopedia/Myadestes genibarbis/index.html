        <p>Der Bartklarino (Myadestes genibarbis) ist ein karibischer Vertreter der Drosseln.<br><br>Er wird 19 cm groß und wiegt 60 bis 72 g. Sein Rücken ist grau, seine Brust ist weiß und die Kehle und das Hinterleib sind rostrot. Sein Gesang besteht aus flötenartigen Tönen.</p>

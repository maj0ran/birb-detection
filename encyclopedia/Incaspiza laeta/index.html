        <p>The buff-bridled Inca finch (Incaspiza laeta) is a species of bird in the family Thraupidae. It is endemic to Peru where its natural habitats are subtropical or tropical dry forests and subtropical or tropical high-altitude shrubland.<br><br><br></p>

        <p>The red-capped crombec (Sylvietta ruficapilla) is a species of African warbler, formerly placed in the family Sylviidae.<br><br>It is found in Angola, Republic of the Congo, the DRC, Malawi, Mozambique, Tanzania, Zambia, Zimbabwe, and possibly Botswana.</p>

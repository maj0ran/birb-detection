        <p>The rufous-capped brushfinch (Atlapetes pileatus) is a species of bird in the family Passerellidae. It is endemic to Mexico.<br>Its natural habitats are subtropical or tropical moist montane forest and subtropical or tropical high-altitude shrubland.<br><br><br></p>
